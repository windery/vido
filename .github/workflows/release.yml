name: Release

# 推送 v* 标签（如 v0.1.0）时自动打包全平台全架构并发布到 GitHub Release；
# 也可在 Actions 页手动触发（workflow_dispatch）。
#
# 产物矩阵：每个「平台 × 架构」一个独立 job，用 CLI --arch 显式指定
#（不依赖 config 里 target 级 arch 数组，规避多架构混编的兼容问题）：
#   macOS   x64 / arm64 / universal（dmg + zip）
#   Windows x64 / arm64（Setup.exe + zip）
#   Linux   x64 / arm64（AppImage + deb）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：全部在 arm64 runner 上构建（x64/universal 交叉构建；macos-13 Intel runner 已退役）
          - os: macos-latest
            label: macos-arm64
            args: --mac --arm64
          - os: macos-latest
            label: macos-x64
            args: --mac --x64
          - os: macos-latest
            label: macos-universal
            args: --mac --universal
          # Windows
          - os: windows-latest
            label: windows-x64
            args: --win --x64
          - os: windows-latest
            label: windows-arm64
            args: --win --arm64
          # Linux
          - os: ubuntu-latest
            label: linux-x64
            args: --linux --x64
          - os: ubuntu-latest
            label: linux-arm64
            args: --linux --arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-${{ matrix.label }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-${{ matrix.label }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & build renderer
        run: |
          pnpm exec vue-tsc --noEmit
          pnpm exec vite build

      - name: Package (electron-builder, publish never)
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          # CI 无签名证书：明确关闭自动发现，避免卡在签名步骤
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vido-${{ matrix.label }}
          path: release/**
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 只上传安装产物（glob 精确到平台+架构，避免误收 unpacked 等中间产物）
          files: |
            artifacts/**/Vido-Mac-x64-*.dmg
            artifacts/**/Vido-Mac-x64-*.zip
            artifacts/**/Vido-Mac-arm64-*.dmg
            artifacts/**/Vido-Mac-arm64-*.zip
            artifacts/**/Vido-Mac-universal-*.dmg
            artifacts/**/Vido-Mac-universal-*.zip
            artifacts/**/Vido-Windows-x64-*.exe
            artifacts/**/Vido-Windows-x64-*.zip
            artifacts/**/Vido-Windows-arm64-*.exe
            artifacts/**/Vido-Windows-arm64-*.zip
            artifacts/**/Vido-Linux-x64-*.AppImage
            artifacts/**/Vido-Linux-x64-*.deb
            artifacts/**/Vido-Linux-arm64-*.AppImage
            artifacts/**/Vido-Linux-arm64-*.deb
          generate_release_notes: true
