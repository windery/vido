name: Release

# 推送 v* 标签（如 v0.1.0）时自动打包全平台全架构并发布到 GitHub Release；
# 也可在 Actions 页手动触发（workflow_dispatch）。
#
# 产物矩阵：每个「平台 × 架构」一个独立 job，用 CLI --arch 显式指定：
#   macOS   x64 / arm64 / universal（dmg + zip，无证书时自动 ad-hoc 签名）
#   Windows x64 / arm64（Setup.exe + zip）
#   Linux   x64 / arm64（AppImage + deb）
#
# 可观测性：electron-builder 日志 tee 进 release/ 随产物上传，
# Release body 自动附「产物清单 + 构建日志摘录」，打包异常可直接从 Release 页定位。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：全部在 arm64 runner 上构建（x64/universal 交叉构建；macos-13 Intel runner 已退役）
          - os: macos-latest
            label: macos-arm64
            args: --mac --arm64
          - os: macos-latest
            label: macos-x64
            args: --mac --x64
          - os: macos-latest
            label: macos-universal
            args: --mac --universal
          # Windows
          - os: windows-latest
            label: windows-x64
            args: --win --x64
          - os: windows-latest
            label: windows-arm64
            args: --win --arm64
          # Linux
          - os: ubuntu-latest
            label: linux-x64
            args: --linux --x64
          - os: ubuntu-latest
            label: linux-arm64
            args: --linux --arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-v2-${{ matrix.label }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-v2-${{ matrix.label }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & build renderer
        run: |
          pnpm exec vue-tsc --noEmit
          pnpm exec vite build

      - name: Package (electron-builder, publish never)
        run: |
          set -o pipefail  # electron-builder 失败必须让 step 失败（tee 不掩盖退出码）
          mkdir -p release
          pnpm exec electron-builder --version
          echo "args: ${{ matrix.args }}"
          pnpm exec electron-builder ${{ matrix.args }} --publish never 2>&1 | tee release/electron-builder.log
          echo "--- release tree ---"
          find release -maxdepth 3 | sort | head -60
        env:
          # CI 无签名证书：明确关闭自动发现（afterPack hook 会给 mac 包做 ad-hoc 签名）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 签名健全性检查：ad-hoc 签名必须通过 strict 校验（Gatekeeper 认这个）
      - name: Verify mac signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find release -type d -name '*.app' > release/app-list.txt
          cat release/app-list.txt
          FAIL=0
          while IFS= read -r APP; do
            [ -n "$APP" ] || continue
            echo "verify: $APP"
            codesign --verify --deep --strict "$APP" || FAIL=1
          done < release/app-list.txt
          exit $FAIL

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: vido-${{ matrix.label }}
          path: release/**
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Build release body (asset manifest + build log excerpts)
        run: |
          {
            echo '## 产物清单 (Assets)'
            echo
            echo '```'
            find artifacts -type f | sort | sed 's|^artifacts/[^/]*/||'
            echo '```'
            echo
            echo '## 构建日志摘录 (electron-builder)'
            echo
            for f in $(find artifacts -name electron-builder.log | sort); do
              echo "===== $f ====="
              echo '```'
              tail -60 "$f"
              echo '```'
              echo
            done
          } > body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 只上传安装产物（unpacked 中间目录已在各 job 的精确 glob 中被排除）
          files: |
            artifacts/**/Vido-Mac-*.dmg
            artifacts/**/Vido-Mac-*.zip
            artifacts/**/Vido-Windows-*.exe
            artifacts/**/Vido-Windows-*.zip
            artifacts/**/Vido-Linux-*.AppImage
            artifacts/**/Vido-Linux-*.deb
          body_path: body.md
          fail_on_unmatched_files: false
