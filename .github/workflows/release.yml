name: Release

# 推送 v* 标签（如 v0.1.0）时自动打包全平台全架构并发布到 GitHub Release；
# 也可在 Actions 页手动触发（workflow_dispatch）。
#
# 产物矩阵：每个「平台 × 架构」一个独立 job，用 CLI --arch 显式指定：
#   macOS   x64 / arm64 / universal（dmg + zip，无证书时自动 ad-hoc 签名）
#   Windows x64 / arm64（Setup.exe + zip）
#   Linux   x64 / arm64（AppImage + deb）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：全部在 arm64 runner 上构建（x64/universal 交叉构建；macos-13 Intel runner 已退役）
          - os: macos-latest
            label: macos-arm64
            args: --mac --arm64
            glob: |
              release/**/Vido-Mac-arm64-*.dmg
              release/**/Vido-Mac-arm64-*.zip
          - os: macos-latest
            label: macos-x64
            args: --mac --x64
            glob: |
              release/**/Vido-Mac-x64-*.dmg
              release/**/Vido-Mac-x64-*.zip
          - os: macos-latest
            label: macos-universal
            args: --mac --universal
            glob: |
              release/**/Vido-Mac-universal-*.dmg
              release/**/Vido-Mac-universal-*.zip
          # Windows
          - os: windows-latest
            label: windows-x64
            args: --win --x64
            glob: |
              release/**/Vido-Windows-x64-*.exe
              release/**/Vido-Windows-x64-*.zip
          - os: windows-latest
            label: windows-arm64
            args: --win --arm64
            glob: |
              release/**/Vido-Windows-arm64-*.exe
              release/**/Vido-Windows-arm64-*.zip
          # Linux
          - os: ubuntu-latest
            label: linux-x64
            args: --linux --x64
            glob: |
              release/**/Vido-Linux-x64-*.AppImage
              release/**/Vido-Linux-x64-*.deb
          - os: ubuntu-latest
            label: linux-arm64
            args: --linux --arm64
            glob: |
              release/**/Vido-Linux-arm64-*.AppImage
              release/**/Vido-Linux-arm64-*.deb
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-${{ matrix.label }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-${{ matrix.label }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & build renderer
        run: |
          pnpm exec vue-tsc --noEmit
          pnpm exec vite build

      - name: Package (electron-builder, publish never)
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          # CI 无签名证书：明确关闭自动发现（afterPack hook 会给 mac 包做 ad-hoc 签名）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 签名健全性检查：ad-hoc 签名必须通过 strict 校验（Gatekeeper 认这个）
      - name: Verify mac signature
        if: runner.os == 'macOS'
        run: |
          for APP in release/*/mac-*/*.app; do
            echo "verify: $APP"
            codesign --verify --deep --strict "$APP"
          done

      # 精确 glob 上传：产物缺失/命名不符时此处直接报错（if-no-files-found: error）
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: vido-${{ matrix.label }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Build release body (asset manifest)
        run: |
          {
            echo '## 产物清单 (Assets)'
            echo
            echo '```'
            find artifacts -type f | sort | sed 's|^artifacts/[^/]*/||'
            echo '```'
          } > body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 只上传安装产物（unpacked 中间目录已在各 job 的精确 glob 中被排除）
          files: |
            artifacts/**/Vido-Mac-*.dmg
            artifacts/**/Vido-Mac-*.zip
            artifacts/**/Vido-Windows-*.exe
            artifacts/**/Vido-Windows-*.zip
            artifacts/**/Vido-Linux-*.AppImage
            artifacts/**/Vido-Linux-*.deb
          body_path: body.md
          fail_on_unmatched_files: true
