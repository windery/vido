name: Release

# 推送 v* 标签（如 v0.1.0）时自动打包全平台全架构并发布到 GitHub Release；
# 也可在 Actions 页手动触发（workflow_dispatch）。
#
# 产物矩阵：每个「平台 × 架构」一个独立 job，用 CLI --arch 显式指定：
#   macOS   x64 / arm64 / universal（dmg + zip，无证书时自动 ad-hoc 签名）
#   Windows x64 / arm64（Setup.exe + zip）
#   Linux   x64 / arm64（AppImage + deb）
#
# 可观测性：electron-builder 日志 tee 进 release/ 随产物上传，
# Release body 自动附「产物清单 + 构建日志摘录」，打包异常可直接从 Release 页定位。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：全部在 arm64 runner 上构建（x64/universal 交叉构建；macos-13 Intel runner 已退役）
          - os: macos-latest
            label: macos-arm64
            args: --mac --arm64
          - os: macos-latest
            label: macos-x64
            args: --mac --x64
          - os: macos-latest
            label: macos-universal
            args: --mac --universal
          # Windows
          - os: windows-latest
            label: windows-x64
            args: --win --x64
          - os: windows-latest
            label: windows-arm64
            args: --win --arm64
          # Linux
          - os: ubuntu-latest
            label: linux-x64
            args: --linux --x64
          - os: ubuntu-latest
            label: linux-arm64
            args: --linux --arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-v2-${{ matrix.label }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-v2-${{ matrix.label }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & build renderer
        run: |
          pnpm exec vue-tsc --noEmit
          pnpm exec vite build

      - name: Package (electron-builder, publish never)
        shell: bash  # 显式 bash：Windows runner 默认 pwsh，pipefail/tee 语法不兼容
        run: |
          set -o pipefail  # electron-builder 失败必须让 step 失败（tee 不掩盖退出码）
          mkdir -p release
          pnpm exec electron-builder --version
          echo "args: ${{ matrix.args }}"
          pnpm exec electron-builder ${{ matrix.args }} --publish never 2>&1 | tee release/electron-builder.log
          echo "--- release tree ---"
          find release -maxdepth 3 | sort | head -60
        env:
          # CI 无签名证书：明确关闭自动发现（afterPack hook 会给 mac 包做 ad-hoc 签名）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 签名健全性检查：ad-hoc 签名必须通过 strict 校验（Gatekeeper 认这个）；
      # 跳过 universal 的临时架构目录（合并前不签）
      - name: Verify mac signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find release -type d -name '*.app' | grep -v -- '-temp' > release/app-list.txt || true
          cat release/app-list.txt
          FAIL=0
          while IFS= read -r APP; do
            [ -n "$APP" ] || continue
            echo "verify: $APP"
            codesign --verify --deep --strict "$APP" || FAIL=1
          done < release/app-list.txt
          exit $FAIL

      - name: Upload build artifact
        if: ${{ always() }}  # 构建失败也上传日志，Release body 可定位
        uses: actions/upload-artifact@v6
        with:
          name: vido-${{ matrix.label }}
          path: release/**
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout (fetch tag message for release notes)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Release notes (annotated tag message via API)
        run: |
          # 发布说明 = 标注 tag 的整体摘要（人工撰写，只讲主要变更，不列逐条提交、不列安装包清单）
          # 走 GitHub API 取标注 tag 的 message，不依赖 checkout 的 tag 对象抓取
          TAG="${GITHUB_REF#refs/tags/}"
          python3 - "$TAG" > body.md <<'PY'
          import json, os, sys, urllib.request
          tag = sys.argv[1]
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          def get(path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/{path}',
                  headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          ref = get(f'refs/tags/{tag}')
          sha = ref['object']['sha']
          obj = get(f'tags/{sha}') if ref['object']['type'] == 'tag' else {'message': ''}
          open('/dev/stdout', 'w').write(obj.get('message', '') or f'v{tag}')
          PY
          [ -s body.md ] || echo "v$TAG" > body.md
          echo "--- release notes ---"
          cat body.md

      - name: Delete stale release (same tag, if any)
        run: |
          # 删 tag 再重建时，GitHub 可能残留同名旧 release 实体导致 body 永不更新；发布前先清掉
          TAG="${GITHUB_REF#refs/tags/}"
          REL_ID=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$REL_ID" ] && [ "$REL_ID" != "None" ]; then
            echo "deleting stale release $REL_ID"
            curl -sS -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID" > /dev/null || true
          else
            echo "no stale release"
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 只上传安装产物（unpacked 中间目录已在各 job 的精确 glob 中被排除）
          files: |
            artifacts/**/Vido-Mac-*.dmg
            artifacts/**/Vido-Mac-*.zip
            artifacts/**/Vido-Windows-*.exe
            artifacts/**/Vido-Windows-*.zip
            artifacts/**/Vido-Linux-*.AppImage
            artifacts/**/Vido-Linux-*.deb
          body_path: body.md
          fail_on_unmatched_files: false
