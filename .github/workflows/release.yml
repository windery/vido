name: Release

# 推送 v* 标签（如 v0.1.0）时自动在 macOS / Windows / Linux 上打包，
# 并统一发布到 GitHub Release。也可在 Actions 页手动触发测试。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & build renderer
        run: |
          pnpm exec vue-tsc --noEmit
          pnpm exec vite build

      - name: Package (electron-builder, publish never)
        run: pnpm exec electron-builder --publish never
        env:
          # CI 无签名证书：明确关闭自动发现，避免卡在签名步骤
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vido-${{ matrix.os }}
          path: release/**
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.{dmg,exe,AppImage}
          generate_release_notes: true
