name: Test

on:
  push:
    branches: [main, ai_dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        package-manager: [pnpm, yarn, npm]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Setup pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v2
        with:
          version: latest
      
      - name: Setup yarn
        if: matrix.package-manager == 'yarn'
        run: npm install -g yarn
      
      - name: Get package manager cache directory
        id: cache-dir
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.package-manager }}" = "yarn" ]; then
            echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
          else
            echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
          fi
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.package-manager }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.package-manager }}-
      
      - name: Install dependencies with pnpm
        if: matrix.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
      
      - name: Install dependencies with yarn
        if: matrix.package-manager == 'yarn'
        run: yarn install --frozen-lockfile
      
      - name: Install dependencies with npm
        if: matrix.package-manager == 'npm'
        run: npm ci
      
      - name: Run type check
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            pnpm typecheck
          elif [ "${{ matrix.package-manager }}" = "yarn" ]; then
            yarn typecheck
          else
            npm run typecheck
          fi
      
      - name: Run linting
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            pnpm lint
          elif [ "${{ matrix.package-manager }}" = "yarn" ]; then
            yarn lint
          else
            npm run lint
          fi
      
      - name: Run core tests
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            pnpm test:core
          elif [ "${{ matrix.package-manager }}" = "yarn" ]; then
            yarn test:core
          else
            npm run test:core
          fi
      
      - name: Run UI tests
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            pnpm test:ui
          elif [ "${{ matrix.package-manager }}" = "yarn" ]; then
            yarn test:ui
          else
            npm run test:ui
          fi
      
      - name: Run all tests with coverage
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            pnpm test:coverage
          elif [ "${{ matrix.package-manager }}" = "yarn" ]; then
            yarn test:coverage
          else
            npm run test:coverage
          fi
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: ${{ matrix.package-manager }}-${{ matrix.node-version }}
          fail_ci_if_error: false