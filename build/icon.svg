<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e1411"/>
      <stop offset="1" stop-color="#080a09"/>
    </linearGradient>
  </defs>
  <!-- 黑绿圆角主体（80% 画布 + 透明边距，符合 macOS 图标规范） -->
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#bg)"/>
  <!-- 3 条细列表线（磷光绿，行距 80） -->
  <line x1="160" y1="176" x2="350" y2="176" stroke="#59d98a" stroke-width="16" stroke-linecap="round"/>
  <line x1="160" y1="256" x2="350" y2="256" stroke="#59d98a" stroke-width="16" stroke-linecap="round"/>
  <line x1="160" y1="336" x2="350" y2="336" stroke="#59d98a" stroke-width="16" stroke-linecap="round"/>
  <!-- 圆点（亮绿），与线左端留 10px 空隙，小图标不粘连 -->
  <circle cx="130" cy="176" r="20" fill="#8af0ab"/>
  <circle cx="130" cy="256" r="20" fill="#8af0ab"/>
  <circle cx="130" cy="336" r="20" fill="#8af0ab"/>
</svg>
